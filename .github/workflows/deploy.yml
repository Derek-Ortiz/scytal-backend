name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Pruebas y seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt bandit pip-audit

      - name: Pruebas unitarias
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:59999/ci
          REDIS_URL: redis://127.0.0.1:59998/0
          JWT_SECRET: secreto-solo-para-ci-0123456789
        run: python -m pytest tests/unit -q

      - name: Análisis de seguridad del código (bandit)
        run: bandit -r app -ll

      - name: Auditoría de dependencias (pip-audit)
        continue-on-error: true
        run: pip-audit -r requirements.txt

  build:
    name: Construir y publicar imagen
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nombre de imagen (minúsculas)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build y push (latest + SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$BACKEND_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONF
          Host scytal
            HostName $BACKEND_HOST
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          CONF
          chmod 600 ~/.ssh/config

      - name: Copiar compose a la EC2
        run: |
          ssh scytal 'mkdir -p /opt/scytal'
          scp deploy/docker-compose.prod.yml scytal:/opt/scytal/docker-compose.yml

      - name: Apuntar .env a la imagen de este commit
        run: |
          ssh scytal "grep -q '^API_IMAGE=' /opt/scytal/.env \
            && sed -i 's|^API_IMAGE=.*|API_IMAGE=${IMAGE}:${GITHUB_SHA}|' /opt/scytal/.env \
            || echo 'API_IMAGE=${IMAGE}:${GITHUB_SHA}' >> /opt/scytal/.env"
          ssh scytal "grep -q '^API_IMAGE=${IMAGE}:${GITHUB_SHA}$' /opt/scytal/.env"

      - name: Desplegar
        run: |
          ssh scytal 'cd /opt/scytal && docker compose pull api && docker compose up -d && docker image prune -f'

      - name: Verificar salud del API
        run: |
          for i in $(seq 1 12); do
            if ssh scytal 'curl -fsS http://localhost:8000/health' > /dev/null 2>&1; then
              echo "API sano (intento $i)"
              exit 0
            fi
            sleep 5
          done
          echo "El API no respondió /health tras 12 intentos"
          ssh scytal 'cd /opt/scytal && docker compose logs --tail=50 api'
          exit 1
