services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scytal}
      POSTGRES_USER: ${POSTGRES_USER:-scytal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scytal_pass}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./squema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./migrations/add_slug.sql:/docker-entrypoint-initdb.d/02-add-slug.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scytal} -d ${POSTGRES_DB:-scytal}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://scytal:scytal_pass@db:5432/scytal
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailhog
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  db_data:
